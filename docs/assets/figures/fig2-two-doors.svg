<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><rect width="860" height="400" fill="#ffffff"/><rect width="860" height="400" fill="#ffffff"/><rect x="40.0" y="165.0" width="150.0" height="66.0" rx="8" fill="#f6f6f4" stroke="#dcdcdc" stroke-width="1"/><text x="115.0" y="192.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#141414" text-anchor="middle" font-weight="500">candidate</text><text x="115.0" y="210.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#141414" text-anchor="middle" font-weight="500">shape</text><rect x="300.0" y="60.0" width="340.0" height="100.0" rx="8" fill="#f6f6f4" stroke="#dcdcdc" stroke-width="1"/><text x="316.0" y="86.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#b3261e" text-anchor="start" font-weight="500">Door A</text><text x="316.0" y="110.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#141414" text-anchor="start" font-weight="400">can a small program draw it?</text><text x="316.0" y="130.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9a9a9a" text-anchor="start" font-weight="400">polynomial / periodic fit</text><text x="624.0" y="110.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#b3261e" text-anchor="end" font-weight="500">6 of 9 families: YES</text><rect x="300.0" y="240.0" width="340.0" height="100.0" rx="8" fill="#f6f6f4" stroke="#dcdcdc" stroke-width="1"/><text x="316.0" y="266.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#b3261e" text-anchor="start" font-weight="500">Door B</text><text x="316.0"