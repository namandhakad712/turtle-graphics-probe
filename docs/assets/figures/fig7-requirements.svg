<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><rect width="860" height="470" fill="#ffffff"/><rect width="860" height="470" fill="#ffffff"/><text x="40.0" y="40.0" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#141414" text-anchor="start" font-weight="400">To emit the command for segment k, the model needs</text><rect x="40.0" y="60.0" width="380.0" height="96.0" rx="8" fill="#eef5ee" stroke="#2f6f3e" stroke-width="1"/><text x="58.0" y="88.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#2f6f3e" text-anchor="start" font-weight="500">the bend angle</text><text x="58.0" y="110.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#141414" text-anchor="start" font-weight="400">the angle between segment k-1 and segment k</text><text x="58.0" y="130.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#2f6f3e" text-anchor="start" font-weight="400">a local quantity, directly readable from the image</text><text x="58.0" y="148.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9a9a9a" text-anchor="start" font-weight="400">cost to obtain: one look</text><rect x="440.0" y="60.0" width="380.0" height="96.0" rx="8" fill="#fbf0ef" stroke="#b3261e" stroke-width="1"/><text x="458.0" y="88.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#b3261e" text-anchor="start" font-weight="500">its own heading</text><text x="458.0" y="110.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#141414" text-anchor="start" font-weight="400">the accumulated direction of the pen</text><text x="458.0" y="130.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#b3261e" text-anchor="start" font-weight="400">NOT needed - the turtle holds this itself</text><text x="458.0" y="148.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9a9a9a" text-anchor="start" font-weight="400">cost to obtain: nothing, because it is never used</text><line x1="430.0" y1="108.0" x2="440.0" y2="108.0" stroke="#5c5c5c" stroke-width="1.5" stroke-linecap="butt"/><text x="435.0" y="100.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5c5c5c" text-anchor="middle" font-weight="400">vs</text><rect x="40.0" y="186.0" width="780.0" height="52.0" rx="8" fill="#f6f6f4" stroke="#dcdcdc" stroke-width="1"/><text x="430.0" y="208.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" font-weight="400">So a misread bend corrupts the turtle's position, not the model's estimate of it.</text><text x="430.0" y="228.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" font-weight="500">The accumulation happens in the turtle, not in the model.</text><rect x="40.0" y="256.0" width="780.0" height="60.0" rx="8" fill="#fbf0ef" stroke="#b3261e" stroke-width="1"/><text x="430.0" y="280.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b3261e" text-anchor="middle" font-weight="400">Therefore drift measures per-step angular precision — a perceptual acuity measure —</text><text x="430.0" y="300.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b3261e" text-anchor="middle" font-weight="500">and not state tracking.</text><text x="40.0" y="352.0" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#141414" text-anchor="start" font-weight="400">And the escape route cannot be closed</text><rect x="40.0" y="372.0" width="380.0" height="72.0" rx="8" fill="#f6f6f4" stroke="#dcdcdc" stroke-width="1"/><text x="58.0" y="396.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#141414" text-anchor="start" font-weight="500">visible scratch work</text><text x="58.0" y="416.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400"># running heading: 47</text><text x="58.0" y="434.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9a9a9a" text-anchor="start" font-weight="400">written into its own output</text><rect x="440.0" y="372.0" width="380.0" height="72.0" rx="8" fill="#f6f6f4" stroke="#dcdcdc" stroke-width="1"/><text x="458.0" y="396.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#141414" text-anchor="start" font-weight="500">or re-summing what it already emitted</text><text x="458.0" y="416.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#5c5c5c" text-anchor="start" font-weight="400">right(12) + right(9) + right(15) = 36</text><text x="458.0" y="434.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9a9a9a" text-anchor="start" font-weight="400">forbid scratch work and this still works</text><text x="430.0" y="464.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" font-weight="500">Every quantity the task needs is readable from the image or recomputable from the model's own tokens.</text></svg>